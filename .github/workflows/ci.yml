name: MAHMOUD AI CI
on:
  push:
    paths:
      - 'mahmoud-ai-video/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'mahmoud-ai-video/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mahmoud-ai-video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
